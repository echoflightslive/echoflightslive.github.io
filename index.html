<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Echo Live - Status</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Google Fonts: Instrument Serif and Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .serif-heading {
            font-family: 'Instrument Serif', serif;
        }
        @keyframes pulse-subtle {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.85; transform: scale(1.02); }
        }
        .animate-pulse-subtle {
            animation: pulse-subtle 3s ease-in-out infinite;
        }
    </style>
</head>
<body class="bg-white text-slate-900 min-h-screen flex flex-col justify-between items-center p-6 sm:p-12 selection:bg-indigo-500 selection:text-white">

    <!-- Ambient Glowing Background Spheres -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none -z-10">
        <div class="absolute -top-40 -left-40 w-96 h-96 bg-indigo-100/50 rounded-full blur-3xl"></div>
        <div class="absolute -bottom-40 -right-40 w-96 h-96 bg-purple-100/40 rounded-full blur-3xl"></div>
    </div>

    <!-- Top Navigation Header -->
    <header class="w-full max-w-4xl flex justify-between items-center py-4">
        <div class="flex items-center space-x-2.5">
            <!-- Header Stylized "E" Logo -->
            <div class="w-8 h-8 rounded-lg bg-slate-950 flex items-center justify-center shadow-md border border-slate-800">
                <span class="serif-heading text-xl font-bold text-white italic select-none leading-none">E</span>
            </div>
            <span class="font-semibold text-lg tracking-tight text-slate-900">Echo Live</span>
        </div>
        
        <!-- Live Status Badge with Purple Light -->
        <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-purple-50 border border-purple-200 text-purple-700 text-xs font-medium">
            <span class="relative flex h-2 w-2">
              <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-purple-400 opacity-75"></span>
              <span class="relative inline-flex rounded-full h-2 w-2 bg-purple-500"></span>
            </span>
            Fixing Outage
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="max-w-md w-full my-auto text-center flex flex-col items-center py-12">
        <!-- Visual Wrench / Cog Icon Card -->
        <div class="w-20 h-20 bg-slate-950 rounded-2xl flex items-center justify-center mb-8 shadow-xl animate-pulse-subtle border border-slate-800">
            <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
            </svg>
        </div>

        <!-- Heading with Instrument Serif -->
        <h1 class="serif-heading text-5xl sm:text-6xl font-normal tracking-tight mb-4 text-slate-900 leading-none">
            Echo Live is down
        </h1>
        
        <!-- Explanation Text -->
        <p class="text-slate-600 text-base sm:text-lg mb-8 max-w-xs sm:max-w-sm leading-relaxed">
            We are actively working to fix it. Service will be restored as soon as possible.
        </p>
    </main>

    <!-- Footer -->
    <footer class="w-full max-w-4xl text-center py-4 border-t border-slate-100 flex flex-col sm:flex-row justify-between items-center text-xs text-slate-400 gap-2">
        <p>&copy; Echo Live. All rights reserved.</p>
        <p class="flex items-center gap-1.5">
            <span class="w-1.5 h-1.5 rounded-full bg-purple-500"></span>
            System status updated real-time
        </p>
    </footer>

</body>
</html>
