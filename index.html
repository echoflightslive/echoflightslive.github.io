<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Echo Live</title>
<meta name="description" content="Live map of Echo United Alliances flights, worked out from the game's timetables. Echo Kyra for now.">
<meta name="theme-color" content="#141a2e">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%237D34FF'/%3E%3Cpath d='M16 5l2 7 7 2-7 2-2 11-2-11-7-2 7-2z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=B612+Mono:wght@400;700&family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
:root{
  --night:#141a2e;--paper:#e9e6f0;--paper2:#dcd8e6;--ink:#1d1730;--muted:#6b6580;--rule:#c9c3d6;
  --kyra:#7d34ff;--kyra-ink:#5a1fd1;--strip:#f1e3ae;--strip-rule:#c9b46c;
  --ui:"Barlow",system-ui,sans-serif;--cond:"Barlow Condensed","Barlow",sans-serif;--mono:"B612 Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--night);color:var(--ink);font:15px/1.45 var(--ui)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--kyra);outline-offset:2px}
#map{position:fixed;inset:0;background:var(--night)}
.leaflet-container{background:var(--night);font:12px/1.4 var(--ui)}
.leaflet-tile-pane{filter:invert(1) hue-rotate(205deg) saturate(.32) brightness(.82) contrast(.88)}
.leaflet-control-attribution{background:rgba(20,26,46,.78)!important;color:#aab0c8!important}
.leaflet-control-attribution a{color:#cfc2ff!important}
.leaflet-control-zoom a{background:var(--paper)!important;color:var(--ink)!important;border-color:var(--rule)!important}
#cv{position:absolute;left:0;top:0;pointer-events:none}
#tip{position:absolute;z-index:460;pointer-events:none;background:var(--ink);color:#fff;font:12px/1.3 var(--mono);padding:4px 7px;border-radius:4px;white-space:nowrap;transform:translate(12px,-50%);display:none}

/* panel */
#panel{position:fixed;z-index:1000;left:14px;top:14px;bottom:14px;width:360px;display:flex;flex-direction:column;
  background:var(--paper);border-radius:10px;box-shadow:0 1px 0 rgba(255,255,255,.4) inset,0 18px 40px rgba(5,8,20,.45);overflow:hidden}
.head{padding:16px 18px 12px;border-bottom:1px solid var(--rule)}
.brand{display:flex;align-items:baseline;gap:10px}
.brand h1{margin:0;font:700 30px/1 var(--cond);letter-spacing:-.01em;white-space:nowrap}
.brand h1 b{color:var(--kyra);font-weight:700}
.brand small{color:var(--muted);font-size:13px}
.count{margin:6px 0 12px;color:var(--muted);font-size:13.5px}
.count strong{color:var(--ink);font:700 15px var(--mono)}
.search{position:relative}
.search input{width:100%;border:1px solid var(--rule);background:#fff;border-radius:7px;padding:10px 12px 10px 36px;font-size:15px}
.search input::placeholder{color:#8d87a0}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted)}
#handle{display:none}
#body{flex:1;overflow:auto;overscroll-behavior:contain}
.foot{padding:9px 18px 11px;border-top:1px solid var(--rule);font-size:12px;color:var(--muted)}

/* rows */
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 18px 8px}
.bar h2{margin:0;font:600 19px/1.15 var(--cond)}
.link{background:none;border:0;padding:4px 0;color:var(--kyra-ink);font-weight:600;font-size:14px}
.link:hover{text-decoration:underline}
.rows{list-style:none;margin:0;padding:0 0 8px}
.row{display:grid;grid-template-columns:12px 1fr auto;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--rule);padding:9px 18px}
.rows li:first-child .row{border-top:0}
.row:hover{background:var(--paper2)}
.row .sw,.al-line .sw{width:12px;height:12px;border-radius:3px;box-shadow:inset 0 0 0 1px rgba(29,23,48,.25)}
.row .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.row .nm span{color:var(--muted);font:12.5px var(--mono);margin-left:6px}
.row .n{font:13px var(--mono);color:var(--muted)}
.row.off{opacity:.45}
.row.two{grid-template-columns:auto 1fr auto}
.row .fn{font:700 14px var(--mono)}
.row .rt{display:block;font:13px var(--mono);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.two>span:nth-child(2){min-width:0}
.row .sub{display:block;font:12.5px var(--ui);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .st{font:12.5px var(--mono);color:var(--muted);text-align:right}
.row .st.air{color:var(--kyra-ink);font-weight:700}
.empty{padding:22px 18px;color:var(--muted)}
.note{margin:0;padding:6px 18px 12px;color:var(--muted);font-size:13px}
.back{display:flex;align-items:center;gap:6px;background:none;border:0;padding:12px 18px 4px;color:var(--kyra-ink);font-weight:600;font-size:14px}

/* the flight strip */
.strip{margin:10px 14px 4px;background:var(--strip);border:1px solid var(--strip-rule);border-left:9px solid var(--al,#7d34ff);border-radius:3px;
  display:grid;grid-template-columns:1.15fr 1.25fr 1fr;color:#2a2210;box-shadow:0 2px 0 rgba(0,0,0,.06)}
.strip>div{padding:8px 10px;border-left:1px solid var(--strip-rule)}
.strip>div:first-child{border-left:0}
.strip .cs{font:700 22px/1 var(--cond);letter-spacing:.01em}
.strip .ty{font:11.5px/1.3 var(--mono);margin-top:6px}
.strip .rt{font:700 17px/1.1 var(--mono);white-space:nowrap}
.strip .via{font:11.5px var(--mono);margin-top:4px}
.strip .tm{font:12.5px/1.6 var(--mono);white-space:nowrap}
.strip .tm b{font-weight:700}
.strip .reg{grid-column:1/-1;border-left:0;border-top:1px solid var(--strip-rule);display:flex;justify-content:space-between;font:11.5px var(--mono);padding:5px 10px}
.al-line{display:flex;align-items:center;gap:8px;padding:2px 18px 0;font-weight:600}
.al-line .sw{width:12px;height:12px;border-radius:3px}
.al-line button{background:none;border:0;padding:0;font-weight:600;color:inherit;text-decoration:underline;text-decoration-color:var(--rule);text-underline-offset:3px}
.prog{padding:12px 18px 4px}
.prog .ends{display:flex;justify-content:space-between;gap:10px}
.prog .ends button{background:none;border:0;padding:0;text-align:left}
.prog .ends button:last-child{text-align:right}
.prog .code{display:block;font:700 26px/1 var(--mono)}
.prog .city{display:block;font-size:13px;color:var(--muted);max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track{position:relative;height:3px;background:var(--rule);border-radius:2px;margin:14px 0 8px}
.track i{position:absolute;left:0;top:0;bottom:0;background:var(--kyra);border-radius:2px}
.track svg{position:absolute;top:50%;width:18px;height:18px;transform:translate(-50%,-50%) rotate(90deg);color:var(--kyra)}
.prog .left{display:flex;justify-content:space-between;font-size:13.5px;color:var(--muted)}
.prog .left b{color:var(--ink);font-weight:600}
dl.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:8px 18px 4px;padding:10px 0 12px;border-top:1px solid var(--rule);font-size:14px}
dl.facts dt{color:var(--muted)}
dl.facts dd{margin:0;font-weight:500}
dl.facts dd .m{font-family:var(--mono);font-size:13.5px}
dl.facts .est{font:11px var(--mono);color:var(--muted);border:1px solid var(--rule);border-radius:3px;padding:0 4px;margin-left:6px;vertical-align:1px}
.acts{display:flex;gap:8px;flex-wrap:wrap;padding:4px 18px 14px}
.btn{border:1px solid var(--rule);background:#fff;border-radius:6px;padding:7px 12px;font-weight:600;font-size:14px}
.btn[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.prim{background:var(--kyra);border-color:var(--kyra);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{border:1px solid var(--rule);background:#fff;border-radius:4px;padding:1px 6px;font:12.5px var(--mono)}
.chip:hover{border-color:var(--kyra)}
h3{margin:14px 18px 4px;font:600 16px var(--cond)}
.fleet{list-style:none;margin:0 18px 10px;padding:0;font-size:14px}
.fleet li{display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-top:1px solid var(--rule)}
.fleet li:first-child{border-top:0}
.fleet span{font-family:var(--mono);font-size:13px;color:var(--muted)}
.lead{display:inline-block;margin-left:8px;font:600 12px var(--ui);color:#fff;background:var(--kyra);border-radius:3px;padding:1px 6px;vertical-align:3px}

/* map extras */
#hud{position:fixed;z-index:900;right:14px;bottom:26px;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.seg{display:flex;background:rgba(233,230,240,.94);border-radius:7px;padding:3px;box-shadow:0 6px 18px rgba(5,8,20,.35)}
.seg button{border:0;background:none;border-radius:5px;padding:5px 10px;font-weight:600;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:#fff;color:var(--ink)}
#legend{background:rgba(233,230,240,.94);border-radius:7px;padding:7px 10px;font:11.5px var(--mono);box-shadow:0 6px 18px rgba(5,8,20,.35)}
#legend .g{width:190px;height:8px;border-radius:4px;margin:3px 0 2px;background:linear-gradient(90deg,#3fd0c9,#9be15d 35%,#f5c542 65%,#ff6fa8)}
#legend .s{display:flex;justify-content:space-between;color:var(--muted)}
#clock{font:12.5px var(--mono);color:#c9c3e6;text-shadow:0 1px 2px #000}
#loading{position:fixed;inset:0;z-index:1200;display:flex;align-items:center;justify-content:center;color:#d8d2f0;font:15px var(--ui);pointer-events:none}
#toast{position:fixed;z-index:1300;left:50%;bottom:30px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 14px;border-radius:6px;font-weight:500;display:none}

@media (max-width:760px){
  #panel{left:0;right:0;top:auto;bottom:0;width:auto;height:calc(138px + env(safe-area-inset-bottom));border-radius:14px 14px 0 0;transition:height .25s ease;padding-bottom:env(safe-area-inset-bottom)}
  #panel.open{height:68vh}
  #panel.full{height:88vh}
  #handle{display:block;width:100%;height:26px;border:0;background:none;position:relative;flex:none;touch-action:none}
  #handle::after{content:"";position:absolute;left:50%;top:10px;width:44px;height:5px;margin-left:-22px;border-radius:3px;background:#a39bb8}
  .head{padding:0 16px 10px;touch-action:none;cursor:grab}
  .head input{touch-action:manipulation}
  #panel.drag{transition:none}
  .brand h1{font-size:25px}
  .count{margin:2px 0 8px}
  .foot{display:none}
  #hud{bottom:calc(146px + env(safe-area-inset-bottom));right:10px}
  #panel.open~#hud,#panel.full~#hud{display:none}
  .leaflet-top.leaflet-right{margin-top:env(safe-area-inset-top)}
  .leaflet-bottom.leaflet-right{bottom:calc(132px + env(safe-area-inset-bottom))}
  #panel.open~#map .leaflet-bottom.leaflet-right{display:none}
}
@media (prefers-reduced-motion:reduce){#panel{transition:none}}
</style>
</head>
<body>
<div id="map" aria-label="Map of Kyra flights"></div>
<aside id="panel" aria-label="Echo Live">
  <button id="handle" type="button" aria-label="Expand panel"></button>
  <div class="head">
    <div class="brand"><h1>Echo <b>Live</b></h1><small>Echo Kyra for now</small></div>
    <p class="count" id="count">Loading the timetables…</p>
    <label class="search"><span class="sr" hidden>Search</span>
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="8.5" cy="8.5" r="6"/><path d="M13 13l5 5"/></svg>
      <input id="q" type="search" autocomplete="off" spellcheck="false" placeholder="Flight, registration, airport or airline" aria-label="Search flights, registrations, airports and airlines">
    </label>
  </div>
  <div id="body"></div>
  <div class="foot" id="foot">Echo Kyra only for now. Timetables captured from the game on 3 October 2026; positions are worked out from the schedule.</div>
</aside>
<div id="hud">
  <div id="clock"></div>
  <div id="legend" hidden><div>Altitude</div><div class="g"></div><div class="s"><span>0</span><span>20,000</span><span>40,000 ft</span></div></div>
  <div class="seg" role="group" aria-label="Colour planes by"><button type="button" data-col="airline" aria-pressed="true">Airline colours</button><button type="button" data-col="alt" aria-pressed="false">Altitude</button></div>
</div>
<div id="tip"></div>
<div id="loading">Loading the timetables…</div>
<div id="toast" role="status"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
"use strict";
/* Where the timetable lives. The publishable key only lets a visitor call
   echo_meta() and echo_parts(); the table itself can't be read or written. */
const SB_URL="https://lqdgdkksdccpeorxedbl.supabase.co", SB_KEY="sb_publishable_Pjrbdd5unAzYqWiamDz_Tw_QJAcj7Rd";

const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtN=n=>Number(n||0).toLocaleString("en-US");
const mod=(x,n)=>((x%n)+n)%n;
const REGION=(()=>{try{return new Intl.DisplayNames(["en"],{type:"region"});}catch(_){return null;}})();
const country=cc=>{try{return REGION&&cc?REGION.of(cc):cc||"";}catch(_){return cc||"";}};

/* ---------- the schedule ----------
   Shared by the page and the background worker (which works out where every
   plane is), so both follow exactly the same rules.
   Every time in the game is local to its airport, read with the airport's real
   time zone at the instant in question. The game stores one row per route; the
   way back leaves after a ground time set by the route's length (60 min up to
   1,500 km, 90 to 4,000, 120 to 10,000, 150 beyond) plus the airline's extra
   turnaround, and flies the route's own inbound time. A stopover route goes on
   from the stop at its own listed time; coming home it turns at the far end and
   waits 60 minutes at the stop. Weekdays count Monday as 0 and belong to the
   first departure. */
function CORE(D){
  const AP={};for(const c in D.ap){const x=D.ap[c];AP[c]={la:x[0],lo:x[1],z:x[2],name:x[3],city:x[4],cc:x[5],hub:false};}
  const TZF=[],OFF=new Map();
  function off(z,ms){
    const h=Math.floor(ms/36e5),k=z*1e7+h;let v=OFF.get(k);if(v!==undefined)return v;
    try{const f=TZF[z]||(TZF[z]=new Intl.DateTimeFormat("en-US",{timeZone:D.tz[z],hourCycle:"h23",year:"numeric",month:"numeric",day:"numeric",hour:"numeric",minute:"numeric"}));
      const p={};f.formatToParts(new Date(h*36e5)).forEach(x=>p[x.type]=x.value);
      v=Math.round((Date.UTC(+p.year,+p.month-1,+p.day,+p.hour%24,+p.minute)-h*36e5)/6e4);}catch(_){v=0;}
    if(OFF.size>200000)OFF.clear();OFF.set(k,v);return v;}
  const offAt=(c,min)=>off(AP[c].z,min*6e4);
  function fromLocal(c,day,m){const L=day*1440+m,z=AP[c].z,u=L-off(z,L*6e4);return L-off(z,u*6e4);}
  const D2R=Math.PI/180,R2D=180/Math.PI;
  function km(a,b){const A=AP[a],B=AP[b];if(!A||!B)return 0;const dla=(B.la-A.la)*D2R,dlo=(B.lo-A.lo)*D2R;
    const h=Math.sin(dla/2)**2+Math.cos(A.la*D2R)*Math.cos(B.la*D2R)*Math.sin(dlo/2)**2;return 2*6371*Math.asin(Math.min(1,Math.sqrt(h)));}
  const groundMin=(a,b)=>{const k=km(a,b);return k<=1500?60:k<=4000?90:k<=10000?120:150;};
  function parseRot(r,i){
    const o={i,ai:r[0],A:r[1],B:r[2],fn:r[3],ifn:r[4],ts:r[5],dur:r[6],idur:r[7],turn:r[8],ac:r[9],dm:r[10],C:null,cs:null};let k=11;
    if(typeof r[11]==="string"){Object.assign(o,{C:r[11],cfn:r[12],cifn:r[13],cts:r[14],cdur:r[15],cidur:r[16],cturn:r[17]});k=18;}
    if(Array.isArray(r[k]))o.cs=r[k];return o;}
  const ROT=D.rot.map(parseRot);
  function legsOf(r,day){
    const t0=fromLocal(r.A,day,r.ts),L=[];
    const mk=(seq,from,to,fn,t,d)=>({r,day,seq,from,to,fn,t,dur:d,key:r.i+":"+day+":"+seq});
    L.push(mk(0,r.A,r.B,r.fn,t0,r.dur));let back;
    if(r.C){const c0=fromLocal(r.B,day,r.cts),c1=c0+r.cdur;L.push(mk(1,r.B,r.C,r.cfn,c0,r.cdur));
      const k0=c1+groundMin(r.B,r.C)+(r.turn||0)+(r.cturn||0);L.push(mk(2,r.C,r.B,r.cifn!=null?r.cifn:r.cfn+1,k0,r.cidur||r.cdur));
      back=k0+(r.cidur||r.cdur)+60;}
    else back=t0+r.dur+groundMin(r.A,r.B)+(r.turn||0);
    L.push(mk(3,r.B,r.A,r.ifn!=null?r.ifn:r.fn+1,back,r.idur||r.dur));return L;}
  const runsOn=(r,day)=>(r.dm>>mod(day+3,7))&1;      // 1 Jan 1970 was a Thursday
  function legsAround(r,a,b){const out=[],d0=Math.floor(a/1440)-3,d1=Math.floor(b/1440)+1;
    for(let d=d0;d<=d1;d++){if(!runsOn(r,d))continue;for(const l of legsOf(r,d))if(l.t<b&&l.t+l.dur>a)out.push(l);}return out;}
  function legAt(ri,day,seq){const r=ROT[ri];return r?legsOf(r,day).find(l=>l.seq===seq)||null:null;}
  /* climb, cruise and descent inside the block time, with taxiing at each end */
  function phases(d){const tout=Math.min(10,d*.12),tin=Math.min(6,d*.08),air=Math.max(1,d-tout-tin);
    const c=Math.min(22,air*.3),de=Math.min(28,air*.35),cr=Math.max(0,air-c-de),v=.3;return {tout,tin,air,c,d:de,cr,v,D:c*(1+v)/2+cr+de*(1+v)/2};}
  function pathFrac(f,d){const b=phases(d),t=f*d-b.tout;if(t<=0)return 0;if(t>=b.air)return 1;let s;
    if(t<b.c)s=b.v*t+(1-b.v)*t*t/(2*b.c);else if(t<b.c+b.cr)s=b.c*(1+b.v)/2+(t-b.c);
    else{const u=t-b.c-b.cr;s=b.c*(1+b.v)/2+b.cr+u-(1-b.v)*u*u/(2*b.d);}return Math.min(1,s/b.D);}
  const cruiseAlt=k=>k<350?21000:k<800?28000:k<2000?35000:k<5500?37000:39000;
  function est(l,f){const d=l.dur,k=km(l.from,l.to),b=phases(d),t=f*d-b.tout,cr=cruiseAlt(k);
    const kt=Math.round(Math.max(250,Math.min(505,k/Math.max(.25,b.D/60)/1.852)));
    if(t<0||t>b.air)return {alt:0,spd:t<0?12:16,vs:0,ground:true};
    let alt,spd,vs;
    if(t<b.c){const p=t/b.c;alt=cr*(1-Math.pow(1-p,1.7));spd=150+(kt-150)*p;vs=1;}
    else if(t>b.air-b.d){const p=Math.max(0,(b.air-t)/b.d);alt=cr*(1-Math.pow(1-p,1.4));spd=140+(kt-140)*p;vs=-1;}
    else{alt=cr;spd=kt;vs=0;}
    if(vs<0)alt=Math.min(alt,(1-pathFrac(f,d))*k*190);
    return {alt:Math.max(0,Math.round(alt/100)*100),spd:Math.round(spd),vs,ground:false};}
  const vec=(la,lo)=>[Math.cos(la*D2R)*Math.cos(lo*D2R),Math.cos(la*D2R)*Math.sin(lo*D2R),Math.sin(la*D2R)];
  function gcSetup(a,b){const A=AP[a],B=AP[b],va=vec(A.la,A.lo),vb=vec(B.la,B.lo);
    const dot=Math.max(-1,Math.min(1,va[0]*vb[0]+va[1]*vb[1]+va[2]*vb[2]));const w=Math.acos(dot);return {va,vb,w,s:Math.sin(w)||1};}
  function gcAt(g,f){if(g.w<1e-9)return [Math.asin(g.va[2])*R2D,Math.atan2(g.va[1],g.va[0])*R2D];
    const k1=Math.sin((1-f)*g.w)/g.s,k2=Math.sin(f*g.w)/g.s,x=k1*g.va[0]+k2*g.vb[0],y=k1*g.va[1]+k2*g.vb[1],z=k1*g.va[2]+k2*g.vb[2];

/* ---------- the background worker ----------
   Every 30 seconds it finds every leg in the air; every few seconds it moves
   them along. The page only receives the finished positions. */

      for(const l of C.legsOf(r,d))if(l.t<=now&&now<l.t+l.dur)out.push(l);}}

/* ---------- loading the timetable ----------
   The browser keeps a copy (IndexedDB). On each visit it asks Supabase for the
   fingerprints of the parts and downloads only the ones that changed. If
   Supabase can't be reached the saved copy is used, and failing that the
   data.json beside this page. */
const idb=(()=>{let p=null;const open=()=>p||(p=new Promise((res,rej)=>{try{const r=indexedDB.open("echo-live",1);
  r.onupgradeneeded=()=>r.result.createObjectStore("parts");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);}catch(e){rej(e);}}));
  const tx=(mode,fn)=>open().then(db=>new Promise((res,rej)=>{const t=db.transaction("parts",mode),s=t.objectStore("parts");const out=fn(s);t.oncomplete=()=>res(out&&out.result!==undefined?out.result:out);t.onerror=()=>rej(t.error);}));

async function rpc(fn,body,ms){
  const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),ms||15000);
  try{const r=await fetch(`${SB_URL}/rest/v1/rpc/${fn}`,{method:"POST",signal:ctl.signal,headers:{apikey:SB_KEY,"Content-Type":"application/json"},body:JSON.stringify(body||{})});
    if(!r.ok)throw new Error(fn+": HTTP "+r.status);return await r.json();}finally{clearTimeout(t);}}

  try{
    const meta=await rpc("echo_meta",{},8000);
    if(!meta||!meta.base)throw new Error("Supabase has no timetable yet");
    const have=(saved&&saved.hash)||{},parts=Object.assign({},saved&&saved.parts);
    const need=Object.keys(meta).filter(k=>have[k]!==meta[k]);
    if(need.length){
      note(saved?`Updating ${need.length} part${need.length===1?"":"s"} of the timetable…`:"Downloading the timetable…");
      const groups=[];for(let i=0;i<need.length;i+=12)groups.push(need.slice(i,i+12));
      const got=await Promise.all(groups.map(g=>rpc("echo_parts",{keys:g},60000)));

    }
    for(const k of Object.keys(parts))if(!(k in meta)){delete parts[k];delete have[k];}
    if(need.length)idb.put("all",{hash:have,parts}).catch(()=>{});
    return {D:assemble(parts.base,parts),src:"Supabase"};
  }catch(e){
    console.info("[Echo Live] Supabase:",e&&e.message);
    if(saved&&saved.parts&&saved.parts.base)return {D:assemble(saved.parts.base,saved.parts),src:"saved copy"};

/* ---------- search ---------- */
let FN={};
function results(q){
  q=q.trim();if(!q)return null;const Q=q.toUpperCase().replace(/\s+/g,""),out=[],now=nowMin();
  const m=Q.match(/^([A-Z0-9]{2})(\d{1,5})$/)||Q.match(/^()(\d{1,5})$/);
  if(m){
    const hits=[];
    for(const [key,list] of Object.entries(FN)){if(m[1]&&!key.startsWith(m[1]+"#"))continue;if(key.split("#")[1]!==m[2])continue;hits.push(...list);}
    const seen=new Set();
    hits.slice(0,60).forEach(([ri,seq])=>{const ls=C.legsAround(ROT[ri],now-60,now+2880).filter(l=>l.seq===seq);
      const l=ls.find(x=>x.t<=now&&now<x.t+x.dur)||ls.find(x=>x.t>now)||ls[0];if(l&&!seen.has(l.key)){seen.add(l.key);out.push({leg:l});}});
  }
  if(/^[A-Z]{3}$/.test(Q)&&AP[Q]&&APROT[Q])out.push({ap:Q});
  const ql=q.toLowerCase();
  AL.forEach((a,i)=>{if(a.code.toUpperCase()===Q||a.name.toLowerCase().includes(ql))out.push({al:i});});
  if(Q.length>=3)for(const reg in REG){if(reg.replace(/-/g,"").includes(Q.replace(/-/g,""))){out.push({reg});if(out.length>40)break;}}
  if(ql.length>=3)for(const c of APLIST){const a=AP[c];if(c!==Q&&((a.city||"").toLowerCase().startsWith(ql)||a.name.toLowerCase().includes(ql)))out.push({ap:c});if(out.length>50)break;}
  return out.slice(0,40);
}
function renderSearch(q){
  const res=results(q);if(!res){route();return;}
  S.view="search";const legs=res.filter(x=>x.leg).map(x=>x.leg);
  body.innerHTML=res.length?`<ul class="rows" style="padding-top:4px">${res.map(x=>{
    if(x.leg)return `<li>${legLine(x.leg)}</li>`;
    if(x.ap){const a=AP[x.ap];return `<li><button type="button" class="row two" data-go="#/airport/${x.ap}"><span class="fn">${x.ap}</span><span class="nm">${esc(a.city||a.name)}<span class="sub" style="display:inline;margin-left:6px">${esc(a.name)}</span></span><span class="st">airport</span></button></li>`;}
    if(x.al!=null)return `<li><button type="button" class="row" data-go="#/airline/${x.al}">${swatch(x.al)}<span class="nm">${esc(AL[x.al].name)}<span>${esc(AL[x.al].code)}</span></span><span class="st">airline</span></button></li>`;
    const r0=ROT[REG[x.reg][0]],ac=ACL[r0.ac];return `<li><button type="button" class="row two" data-go="#/reg/${encodeURIComponent(x.reg)}"><span class="fn">${esc(x.reg)}</span><span class="sub">${esc(MODELS[ac[0]])} · ${esc(AL[r0.ai].name)}</span><span class="st">aircraft</span></button></li>`;
  }).join("")}</ul>`:`<div class="empty">Nothing matches “${esc(q)}”. Try a flight number like CX731, a registration, an airport code or an airline name.</div>`;
  bindLegs(legs);body.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{$("q").value="";go(b.dataset.go);});
  sheet("full");
}

/* ---------- links ---------- */
function go(h,silent){if(location.hash===h){if(!silent)route();return;}if(silent)history.replaceState(null,"",h);else location.hash=h;}
function route(){
  if(!D)return;
  const p=decodeURIComponent(location.hash.slice(1)).split("/").filter(Boolean);
  if(p[0]==="airline"&&AL[+p[1]]){renderAirline(+p[1]);return;}
  if(p[0]==="airport"){renderAirport((p[1]||"").toUpperCase());return;}
  if(p[0]==="reg"){renderReg(p[1]||"");return;}
  if(p[0]==="flight"){
    const r=ROT[+p[2]],now=nowMin(),fn=+((p[1]||"").match(/\d+$/)||[])[0];let cand=[];
    if(r&&(r.fn===fn||r.ifn===fn||r.cfn===fn||r.cifn===fn))cand=C.legsAround(r,now-60,now+2880).filter(l=>l.fn===fn);
    else cand=(results(p[1]||"")||[]).filter(x=>x.leg).map(x=>x.leg);
    const live=cand.map(l=>findPlane(l.r.i,l.day,l.seq)).find(i=>i>=0);
    if(live!=null){const q=plane(live);if(!S.sel||S.sel.ri!==q.ri||S.sel.day!==q.day||S.sel.seq!==q.seq)selectPlane(live,true);else renderFlight();return;}
    const l=cand.find(x=>x.t>now)||cand[0];
    if(l){S.sel=null;renderLeg(l);redraw();return;}
    body.innerHTML=`<button type="button" class="back" id="bk">‹ All airlines</button><div class="empty">${esc(p[1])} isn't flying in the next two days.</div>`;$("bk").onclick=()=>go("#/");return;
  }
  S.sel=null;renderHome();sheet(null);redraw();
}

let tt=0;function toast(t){const e=$("toast");e.textContent=t;e.style.display="block";clearTimeout(tt);tt=setTimeout(()=>e.style.display="none",2200);}
document.querySelectorAll("[data-col]").forEach(b=>b.onclick=()=>{S.col=b.dataset.col;document.querySelectorAll("[data-col]").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));$("legend").hidden=S.col!=="alt";redraw();});
function clock(){$("clock").textContent=new Date().toISOString().slice(11,16)+" UTC";}

/* ---------- start ---------- */
let worker=null,lastFlightPaint=0,lastHome=0;
function onPositions(m){
  const first=!S.P;S.P=m;S.n=m.n;updateCount();
  if(first){$("loading")&&$("loading").remove();route();}
  else if(S.view==="home"&&performance.now()-lastHome>30000){lastHome=performance.now();renderHome();}
  if(S.sel&&S.follow){const i=selIndex();if(i>=0)map.panTo([S.P.la[i],S.P.lo[i]],{animate:true});}
  draw();
  if(S.view==="flight"&&performance.now()-lastFlightPaint>3500){lastFlightPaint=performance.now();if(selIndex()<0){S.sel=null;renderHome();}else renderFlight();}
}
let tick=0;
function pulse(){
  tick++;const z=map.getZoom();
  /* zoomed out, planes move about a pixel a minute, so they are moved on less often */
  if(z<=3&&tick%3&&!S.sel)return;
  worker.postMessage({now:nowMin()});
}
async function start(){
  const note=t=>{const l=$("loading");if(l)l.textContent=t;};
  let got;
  try{got=await loadData(note);}
  catch(e){note("The timetables didn't load. Check your connection and reload the page.");$("count").textContent="Timetables not loaded.";return;}
  D=got.D;SRC=got.src;C=CORE(D);AP=C.AP;ROT=C.ROT;MODELS=D.models;ACL=D.ac;
  AL=D.airlines.map(a=>Object.assign(a,{mc:mapColor(a.color)}));
  AL.forEach(a=>a.hubs.forEach(h=>{if(AP[h])AP[h].hub=true;}));
  const used=new Set();
  ROT.forEach(r=>{
    [r.A,r.B,r.C].forEach(c=>{if(c){(APROT[c]=APROT[c]||[]).push(r.i);used.add(c);}});
    const code=AL[r.ai].code,add=(fn,seq)=>{if(fn==null)return;const k=code+"#"+fn;(FN[k]=FN[k]||[]).push([r.i,seq]);};
    add(r.fn,0);add(r.ifn!=null?r.ifn:r.fn+1,3);if(r.C){add(r.cfn,1);add(r.cifn!=null?r.cifn:r.cfn+1,2);}
    (r.cs||[]).forEach(x=>{const m=x.match(/^([A-Z0-9]{2})(\d+)\/(\d+)$/);if(!m)return;
      (FN[m[1]+"#"+m[2]]=FN[m[1]+"#"+m[2]]||[]).push([r.i,0]);(FN[m[1]+"#"+m[3]]=FN[m[1]+"#"+m[3]]||[]).push([r.i,3]);});
    const reg=acReg(r.ac);if(reg){const k=reg.toUpperCase();(REG[k]=REG[k]||[]).push(r.i);}
  });
  for(const k in APROT)APROT[k]=[...new Set(APROT[k])];
  APLIST=[...used].filter(c=>AP[c]).sort((a,b)=>(AP[a].hub?1:0)-(AP[b].hub?1:0));
  $("foot").textContent=`Echo Kyra only for now. Timetables captured from the game on ${new Date(D.captured+"T12:00Z").toLocaleDateString("en-GB",{day:"numeric",month:"long",year:"numeric"})}, loaded from ${SRC}; positions are worked out from the schedule.`;
  resize();note("Placing the planes…");
  try{
    const src=`const mod=${mod.toString()};const CORE=${CORE.toString()};(${WORKER.toString()})();`;
    worker=new Worker(URL.createObjectURL(new Blob([src],{type:"text/javascript"})));
    worker.onmessage=e=>onPositions(e.data);
    worker.postMessage({data:D,now:nowMin()});
  }catch(e){
    /* no workers (very old browsers): do the same work here */
    const ctx=new Function("postMessage","CORE","mod",`let onmessage;(${WORKER.toString().replace(/^function WORKER\(\)\{/,"").replace(/\}$/,"")});return m=>onmessage({data:m});`);
    const send=ctx(m=>onPositions(m),CORE,mod);worker={postMessage:send};send({data:D,now:nowMin()});
  }
  setInterval(pulse,4000);
  clock();setInterval(clock,10000);
}
addEventListener("resize",()=>{map.invalidateSize();resize();});
start();
</script>
</body>
</html>
